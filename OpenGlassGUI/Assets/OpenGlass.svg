      <feGaussianBlur stdDeviation="3.4783"/>
    </filter>
    <filter id="window-shadow" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6.5831"/>
    </filter>
    <filter id="surface" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
