      <feFlood flood-color="#808080" result="outline-color"/>
      <feComposite in="outline-color" in2="outer-ring" operator="in" result="outline"/>
      <feMerge><feMergeNode in="outline"/><feMergeNode in="SourceGraphic"/></feMerge>
