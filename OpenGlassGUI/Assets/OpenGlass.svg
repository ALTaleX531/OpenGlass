      <path d="M-32 64H240V288H-32Z" fill="url(#glass-tint)"/>
    </g>
  </g>
  <path d="M-32 65.6H224.5333V288" stroke="#fff" stroke-opacity=".5" stroke-width="3.2"/>

  <!-- Partially cropped maximize button, including its taller top bar. -->
