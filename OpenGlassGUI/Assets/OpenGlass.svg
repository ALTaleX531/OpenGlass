  <g filter="url(#content-edge)">
    <path d="M-16 163.64H207.24V300H-16Z" fill="#000"/>
    <path d="M-16 166.84H204.04V300H-16Z" fill="#f0f0f0"/>
  </g>
  </g>
  <!-- Supplied reg.ico: restored registry L and sparkle, upper-left tile centered on the window-button divider, bottom inset 8 units. -->
  <g id="registry-outlined" filter="url(#registry-outline-filter)">
  <g id="registry-badge" transform="translate(17.7067 123.584) scale(13.824)" aria-label="Three registry rectangles in an L shape at the lower left">
